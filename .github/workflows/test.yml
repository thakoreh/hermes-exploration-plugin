name: Fresh install and discovery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" build
      - run: python -m pytest -q
      - run: python -m build
      - name: Install built wheel as a fresh consumer
        shell: bash
        run: |
          python -m venv .qa-consumer
          if [ -f .qa-consumer/Scripts/python.exe ]; then
            consumer=.qa-consumer/Scripts/python.exe
          else
            consumer=.qa-consumer/bin/python
          fi
          "$consumer" -m pip install --no-deps dist/*.whl
          "$consumer" -I tests/smoke_installed.py
